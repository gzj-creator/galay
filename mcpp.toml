[package]
name        = "galay"
version     = "4.10.0"
description = "C++23 coroutine networking and protocol framework"
license     = "Apache-2.0"
standard    = "c++23"
platforms   = ["linux", "macos"]

# Galay has no single umbrella module.  This path removes mcpp's conventional
# root-module warning while the source list below keeps every named module
# interface independently importable (galay.utils, galay.kernel, ...).
[lib]
path = "src/cpp/galay-utils/module/galay_utils.cppm"

[build]
# mcpp builds the C++ implementation and C++23 module interfaces only.  The C
# ABI wrappers under src/c and their architecture-specific coroutine assembly
# are intentionally outside this package; C++ consumers use the named modules
# and C++ headers directly.
sources = [
    "src/cpp/galay-utils/**/*.cc",
    "src/cpp/galay-utils/module/*.cppm",
    "src/cpp/galay-kernel/**/*.cc",
    "src/cpp/galay-kernel/module/*.cppm",
]

# The repository's source includes use the installed prefix
# <galay/cpp/...> and <galay/thirdparty/...>.  The tracked include/galay
# links mirror the layout generated by CMake without requiring a prior CMake
# configure step.
include_dirs = [
    "include",
    "src/cpp",
    "thirdparty",
]

# libaio and several glibc declarations are GNU extensions.  This is private
# to Galay's own translation units; feature defines below are used for macros
# that must also be visible to downstream consumers.
cxxflags = ["-D_GNU_SOURCE"]

[targets.galay]
kind   = "shared"
soname = "libgalay.so.4"

# Keep the platform default aligned with CMake: Linux uses epoll and macOS
# uses kqueue.  These are package build inputs; consumers selecting an
# alternate backend should use the corresponding backend feature below.
[target.linux.build]
defines = ["USE_EPOLL"]
ldflags = ["-pthread", "-ldl", "-Wl,--version-script=../../../mcpp/libaio.map"]

[target.macos.build]
defines = ["USE_KQUEUE"]

# libaio is Linux-only and is needed by the epoll kernel implementation.
# Keeping it conditional avoids resolving a Linux ABI package on macOS.
[target.linux.dependencies.compat]
libaio = "0.3.113"

[features]
# The default is deliberately small and has no OpenSSL dependency.  Consumers
# opt into protocol/database/tracing modules explicitly, or use `full` below.
default = ["base"]
base = []

# I/O backend controls.  `epoll` and `kqueue` are useful when compiling code
# that includes Galay headers directly.  The platform blocks above provide
# the safe native default; io-uring remains an explicit opt-in because mcpp
# features are additive and cannot remove a target-level USE_EPOLL define.
backend-epoll  = { defines = ["USE_EPOLL", "GALAY_DISABLE_IOURING=1"] }
backend-kqueue = { defines = ["USE_KQUEUE"] }
backend-io-uring = { defines = ["USE_IOURING"] }
ws = ["websocket"]

# One opt-in that mirrors a CMake build with every C++ module enabled.  SSL is
# still explicit in ordinary builds so users can keep the dependency graph
# small and choose plaintext-only protocol surfaces.
full = [
    "ssl",
    "websocket",
    "http2",
    "redis",
    "etcd",
    "mysql",
    "postgres",
    "mongo",
    "rpc-etcd",
    "mcp",
    "tracing",
]

# OpenSSL is feature-scoped so a utils/kernel-only consumer does not download
# or build it.  The feature define is transitive and therefore reaches a
# downstream TU importing a TLS-enabled Galay module.
[features.ssl]
sources = [
    "src/cpp/galay-ssl/**/*.cc",
    "src/cpp/galay-ssl/module/*.cppm",
]
defines = ["GALAY_SSL_FEATURE_ENABLED"]

[features.http]
sources = [
    "src/cpp/galay-http/**/*.cc",
    "src/cpp/galay-http/module/*.cppm",
]

[features.websocket]
sources = [
    "src/cpp/galay-ws/**/*.cc",
    "src/cpp/galay-ws/module/*.cppm",
]
implies = ["http"]

[features.http2]
sources = [
    "src/cpp/galay-http2/**/*.cc",
    "src/cpp/galay-http2/module/*.cppm",
]
implies = ["http"]

[features.redis]
# The unified async client contains both Redis and Rediss implementations;
# the latter is compiled only when the transitive SSL feature define is set.
sources = [
    "src/cpp/galay-redis/base/*.cc",
    "src/cpp/galay-redis/async/conn_pool.cc",
    "src/cpp/galay-redis/async/client.cc",
    "src/cpp/galay-redis/async/topology_client.cc",
    "src/cpp/galay-redis/protoc/*.cc",
    "src/cpp/galay-redis/sync/*.cc",
    "src/cpp/galay-redis/module/*.cppm",
]

# etcd and MCP use the repository-vendored simdjson implementation.  The
# helper feature keeps that one source compiled exactly once when either
# public module is selected.
[features.simdjson]
sources = ["thirdparty/simdjson/simdjson.cpp"]
defines = ["SIMDJSON_THREADS_ENABLED=1"]

[features.etcd]
sources = [
    "src/cpp/galay-etcd/**/*.cc",
    "src/cpp/galay-etcd/module/*.cppm",
]
implies = ["http", "simdjson"]

[features.mysql]
sources = [
    "src/cpp/galay-mysql/**/*.cc",
    "src/cpp/galay-mysql/module/*.cppm",
]

[features.postgres]
sources = [
    "src/cpp/galay-postgres/**/*.cc",
    "src/cpp/galay-postgres/module/*.cppm",
]

[features.mongo]
sources = [
    "src/cpp/galay-mongo/**/*.cc",
    "src/cpp/galay-mongo/module/*.cppm",
]

[features.rpc]
sources = [
    "src/cpp/galay-rpc/common/*.cc",
    "src/cpp/galay-rpc/module/galay_rpc.cppm",
]

[features.rpc-etcd]
sources = ["src/cpp/galay-rpc/module/galay_rpc_etcd.cppm"]
defines = ["GALAY_RPC_HAS_ETCD=1"]
implies = ["rpc", "etcd"]

[features.mcp]
sources = [
    "src/cpp/galay-mcp/**/*.cc",
    "src/cpp/galay-mcp/module/*.cppm",
]
implies = ["http", "simdjson"]

# tracing/common/id_format.cc always calls OpenSSL RAND_bytes, even when the
# HTTP and spdlog adapters are disabled, so tracing owns the same optional
# OpenSSL dependency as ssl.
[features.tracing]
sources = [
    "src/cpp/galay-tracing/common/*.cc",
    "src/cpp/galay-tracing/context/*.cc",
    "src/cpp/galay-tracing/kernel/*.cc",
    "src/cpp/galay-tracing/log/*.cc",
    "src/cpp/galay-tracing/module/*.cppm",
]

[features.tracing-http]
defines = ["GALAY_TRACING_ENABLE_OTLP_HTTP=1"]
implies = ["tracing", "http"]

[features.tracing-spdlog]
sources = ["src/cpp/galay-tracing/adapters/spdlog_sink.cc"]
implies = ["tracing"]

[feature-deps.ssl]
compat.openssl = "3.5.1"

[feature-deps.tracing]
compat.openssl = "3.5.1"

[feature-deps.tracing-spdlog]
compat.spdlog = "1.17.0"
